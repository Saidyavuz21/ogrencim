# gitleaks yapılandırması — varsayılan kurallar + proje kuralları.
[extend]
useDefault = true

[[rules]]
id = "supabase-secret-key"
description = "Supabase gizli anahtarı (sb_secret_…) ya da koda yazılmış service_role JWT'si"
# Yalnızca gerçek anahtar biçimini yakalar; belgelerde geçen "service_role" kelimesi alarm vermez.
regex = '''(?i)(sb_secret_[A-Za-z0-9_-]{20,}|SUPABASE_SERVICE(_ROLE)?_KEY\s*[:=]\s*['"]?eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,})'''
keywords = ["sb_secret_", "supabase_service"]

[[rules]]
id = "hardcoded-password"
description = "Kaynak koda gömülü şifre"
regex = '''(?i)password\s*[:=]\s*['"][^'"\s]{6,}['"]'''
keywords = ["password"]

[allowlist]
description = "Geçmişte kalan, artık geçersiz (değiştirilmiş) demo şifreleri"
commits = [
  "981d577c5c91e0d5f97bfff5df31c968db7c9cbe",
  "fcb6531aef0a39b79e1816d3cc779cca67d41163",
  "a7b0ea4c7a7713ad89173461dc05e5819c17e81b",
  "b5b8eda4e832648cb6d74f47978f816d6396af08",
  "0b65580fc8cbf58d1838b417bc58972033b5800a",
]
paths = [
  '''node_modules/''',
  '''\.env\.example$''',
  '''\.gitleaks\.toml$''',
]
